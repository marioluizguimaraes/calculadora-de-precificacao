name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: calculadora-de-precificacao

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: calculadora-de-precificacao/.nvmrc
          cache: npm
          cache-dependency-path: calculadora-de-precificacao/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:tokens
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
